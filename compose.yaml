services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rick_memes}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-setup:
    build:
      context: .
      target: database
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rick_memes}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rick_memes}
      UPLOAD_DIR: /app/uploads
      BASE_URL: ${BASE_URL:-https://rick-memes.nl}
      ADMIN_PASSPHRASE: ${ADMIN_PASSPHRASE:-}
      ACCESS_QUESTION: ${ACCESS_QUESTION:-Wat is de naam van Rick zijn hond?}
      ACCESS_ANSWER: ${ACCESS_ANSWER:-}
      ACCESS_SESSION_SECRET: ${ACCESS_SESSION_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data: